<body>

<div class="fixed-header-group">
    <header>

<div class="container">
    <!-- 本日・同時進行の重なりサマリー -->

    <!-- 現場タイル一覧 -->

<!-- 日程調整＆Gカレンダー連動モーダル -->
<div class="overlay" id="overlay" onclick="closeModal()"></div>
<div id="dateModal" class="modal-box">
    <h3 style="margin-top:0; margin-bottom:6px; color:#2c3e50;">📅 工期・予定の変更</h3>
    <p id="editSiteName" style="font-weight:bold; font-size:1.1rem; color:#2980b9; border-bottom:1px solid #eee; padding-bottom:8px; margin-top:0;"></p>

    <div style="background:#f8f9fa; padding:10px; border-radius:8px; border:1px solid #eee;">
        <div style="font-size:0.8rem; font-weight:bold; color:#555;">⚡ 雨天・予定変更クイック順延（全体スライド）</div>
        <div class="shift-btn-group">
            <button type="button" class="shift-btn" onclick="shiftModalDates(-1, -1)">◀ -1日</button>
            <button type="button" class="shift-btn" onclick="shiftModalDates(1, 1)">+1日 ▶</button>
            <button type="button" class="shift-btn" onclick="shiftModalDates(2, 2)">+2日 ▶▶</button>
            <button type="button" class="shift-btn" onclick="shiftModalDates(0, 1)">完工のみ+1日</button>
        </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
        <div>
            <label>着工日（開始日）</label>
            <input type="date" id="editStart">
        </div>
        <div>
            <label>完工予定（終了日）</label>
            <input type="date" id="editEnd">
        </div>
    </div>

    <label>ステータス変更</label>
    <select id="editStatus">
        <option value="estimate">📄 見積中（現調・打合せ）</option>
        <option value="contract">🤝 契約済み・施工中</option>
        <option value="billing">💰 請求中</option>
        <option value="complete">✅ 完了</option>
    </select>

    <!-- ピンポイント予定（日報の【予定】と同じdx_schedulesへ追加） -->
    <details style="margin-top:14px; border-top:1px dashed #ccc; padding-top:10px;">
        <summary style="font-size:0.85rem; font-weight:bold; color:#d35400; cursor:pointer;">➕ ピンポイント予定（現調・足場・打合せ等）を追加</summary>
        <div style="margin-top:8px; background:#fff8e1; padding:10px; border-radius:8px;">
            <div style="display:grid; grid-template-columns: 1.3fr 1fr; gap:8px;">
                <input type="date" id="pinDate">
                <input type="time" id="pinTime" value="09:00">
            </div>
            <input type="text" id="pinDetail" placeholder="内容 (例: 現調 / 足場組立 / 色打合せ)" style="margin-top:6px;">
            <button type="button" onclick="addPinScheduleFromManager()" style="width:100%; margin-top:8px; padding:8px; background:#e67e22; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">🔔 この予定タグを追加</button>
        </div>
    </details>

    <!-- お客さん公開用 Googleカレンダー連携ボタン -->
    <div style="margin-top:18px; padding-top:12px; border-top:1px solid #eee;">
        <button onclick="sendCalendarFromManager(event)" style="width:100%; background:#f39c12; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer; font-size:0.95rem; margin-bottom:10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
            📅 Gカレンダーに反映（名刺QR連動）＆保存
        </button>

        <div style="display:flex; gap:8px;">
            <button onclick="closeModal()" style="flex:1; background:#95a5a6; color:white; border:none; padding:12px; border-radius:8px; cursor:pointer; font-weight:bold;">閉じる</button>
            <button onclick="saveSchedule()" style="flex:1.5; background:#2980b9; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">💾 アプリのみ保存</button>
        </div>
    </div>
</div>

<div id="notification" class="notification"></div>

<script>
    let sites = [];
    let schedules = [];
    let currentFilter = 'upcoming';
    let editingId = null;

    function loadData() {
        sites = JSON.parse(localStorage.getItem('dx_sites') || '[]');
        schedules = JSON.parse(localStorage.getItem('dx_schedules') || '[]');
    }

    function setFilter(filterName, btn) {
        currentFilter = filterName;
        document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        renderTiles();
    }

    function parseYMD(str) {
        if (!str) return null;
        const clean = str.trim().replace(/-/g, '/');
        const d = new Date(clean);
        return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function formatYMD(dateObj) {
        const y = dateObj.getFullYear();
        const m = ('0' + (dateObj.getMonth() + 1)).slice(-2);
        const d = ('0' + dateObj.getDate()).slice(-2);
        return `${y}-${m}-${d}`;
    }

    function formatShortDate(str) {
        const d = parseYMD(str);
        if (!d) return '';
        const w = ['日','月','火','水','木','金','土'][d.getDay()];
        return `${d.getMonth()+1}/${d.getDate()}(${w})`;
    }

    function getDiffDays(d1, d2) {
        const t1 = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate()).getTime();
        const t2 = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate()).getTime();
        return Math.round((t2 - t1) / 86400000);
    }

    // 現場に紐づく日報の「【予定】」（dx_schedules）を取得
    function getSiteSchedules(site) {
        const now = Date.now() - (12 * 3600 * 1000); // 半日前以降の予定をすべて対象（1ヶ月先でも全て拾う）
        return schedules.filter(sc => {
            if (sc.targetTime && sc.targetTime < now) return false;
            return (sc.siteId && String(sc.siteId) === String(site.id)) ||
                   (sc.siteName && site.name && sc.siteName === site.name);
        }).sort((a, b) => (a.targetTime || 0) - (b.targetTime || 0));
    }

    // 「現調 7/15 10:00」などのworkDays文字列からも日付を推測
    function parseWorkDaysDate(workDaysStr) {
        if (!workDaysStr) return null;
        const m = String(workDaysStr).match(/(\d{1,2})\/(\d{1,2})/);
        if (!m) return null;
        const now = new Date();
        let year = now.getFullYear();
        const month = parseInt(m[1], 10) - 1;
        const day = parseInt(m[2], 10);
        let dt = new Date(year, month, day);
        if (dt.getTime() < now.getTime() - 60 * 86400000) {
            dt = new Date(year + 1, month, day);
        }
        return dt;
    }

    // 他の現場との工期重なり（重複）を検出
    function findOverlappingSites(site, allActiveSites) {
        const s1 = parseYMD(site.start);
        const e1 = parseYMD(site.end) || s1;
        if (!s1) return [];

        return allActiveSites.filter(other => {
            if (other.id === site.id) return false;
            const s2 = parseYMD(other.start);
            const e2 = parseYMD(other.end) || s2;
            if (!s2) return false;
            return s1 <= e2 && e1 >= s2;
        });
    }

    function renderTiles() {
        loadData();
        const listEl = document.getElementById('scheduleTileList');
        const summaryEl = document.getElementById('overlapSummary');
        listEl.innerHTML = '';

        const today = new Date();
        const todayZero = new Date(today.getFullYear(), today.getMonth(), today.getDate());

        // 完了・失注を除き、「請求(billing)」も予定タグが無い限り重複計算から外す
        const activePool = sites.filter(s => {
            if (s.status === 'complete' || s.status === 'done' || s.status === 'lost') return false;
            if (s.status === 'billing') return getSiteSchedules(s).length > 0;
            return true;
        });

        // ① 本日稼働中（または今日予定がある）現場のサマリーを作成
        const todayRunning = activePool.filter(s => {
            const st = parseYMD(s.start);
            const ed = parseYMD(s.end) || st;
            const inPeriod = st && st <= todayZero && ed >= todayZero;
            const siteScheds = getSiteSchedules(s);
            const hasTodaySched = siteScheds.some(sc => {
                const scDate = new Date(sc.targetTime);
                return scDate.toDateString() === today.toDateString();
            });
            return inPeriod || hasTodaySched;
        });

        if (todayRunning.length > 0) {
            const chips = todayRunning.map(s => `<span class="overlap-chip">🔨 ${s.name}</span>`).join('');
            summaryEl.innerHTML = `
                <div class="overlap-title">
                    <span>🔥 本日の稼働・予定現場（同時進行: ${todayRunning.length}件）</span>
                    <span>${today.getMonth()+1}/${today.getDate()}</span>
                </div>
                <div class="overlap-chips">${chips}</div>
            `;
        } else {
            summaryEl.innerHTML = `
                <div class="overlap-title" style="margin-bottom:0;">
                    <span>📅 本日（${today.getMonth()+1}/${today.getDate()}）に工期が重なっている現場はありません</span>
                </div>
            `;
        }

        // ② 各現場にソート用の優先度スコアと直近日付を付与
        const enriched = sites.map(site => {
            const isDone = (site.status === 'complete' || site.status === 'done' || site.status === 'lost');
            const isBilling = (site.status === 'billing');
            const stDate = parseYMD(site.start);
            const edDate = parseYMD(site.end) || stDate;
            const siteScheds = getSiteSchedules(site);
            const hasPinSchedule = siteScheds.length > 0;
            const nextSchedTime = hasPinSchedule ? siteScheds[0].targetTime : null;
            const workDaysDate = parseWorkDaysDate(site.workDays);

            // 請求中の現場は、現場自体は完工しているため「現在着工中(グループ1)」には入れない
            const isCurrentlyRunning = !isDone && !isBilling && stDate && stDate <= todayZero && edDate >= todayZero;

            // ソート用の基準日時
            // ※「請求」ステータスの場合は過去の着工日を無視し、予定タグ(nextSchedTime)のみを基準にする
            let candidates = [];
            if (nextSchedTime) candidates.push(nextSchedTime);
            if (!isBilling && stDate) candidates.push(stDate.getTime());
            if (!isBilling && workDaysDate) candidates.push(workDaysDate.getTime());

            const earliestTime = candidates.length > 0 ? Math.min(...candidates) : null;

            // グループ分け: 1=現在着工中, 2=予定・工期あり(日付順), 3=日程未定, 4=完了・請求(予定なし)・失注
            let group = 3;
            if (isDone || (isBilling && !hasPinSchedule)) group = 4;
            else if (isCurrentlyRunning) group = 1;
            else if (earliestTime !== null) group = 2;

            return {
                site,
                isDone,
                isBilling,
                hasPinSchedule,
                stDate,
                edDate,
                siteScheds,
                workDaysDate,
                isCurrentlyRunning,
                earliestTime,
                group
            };
        });

        // ③ フィルター適用
        let filtered = enriched.filter(item => {
            if (currentFilter === 'upcoming') {
                // 完了・失注は除外。「請求」は予定タグ(hasPinSchedule)がある時だけ表示！
                if (item.isDone) return false;
                if (item.isBilling && !item.hasPinSchedule) return false;
                return true;
            }
            if (currentFilter === 'activeOnly') {
                return !item.isDone && (item.site.status === 'contract' || item.site.status === 'active' || item.isCurrentlyRunning);
            }
            if (currentFilter === 'nodate') {
                return !item.isDone && !item.isBilling && item.group === 3;
            }
            return true; // 'all'（完了や予定なしの請求現場もすべて表示）
        });
        
        // ④ ソート（着工中 ➔ 日報予定・着工日が近い順 ➔ 未定 ➔ 完了）
        filtered.sort((a, b) => {
            if (a.group !== b.group) return a.group - b.group;
            if (a.earliestTime !== null && b.earliestTime !== null) {
                return a.earliestTime - b.earliestTime;
            }
            return (b.site.updatedAt || 0) - (a.site.updatedAt || 0);
        });

        if (filtered.length === 0) {
            listEl.innerHTML = `<div style="text-align:center; padding:40px; color:#888;">該当する現場がありません。</div>`;
            return;
        }

        let currentGroupHeader = 0;
        const groupTitles = {
            1: '🟢 現在稼働中・着工中の現場',
            2: '📅 今後の予定・着工順（日報予定・工期連動）',
            3: '⚠️ 日程・予定が未定の現場',
            4: '✅ 完了・その他の現場'
        };

        filtered.forEach(item => {
            const { site, stDate, edDate, siteScheds, isCurrentlyRunning, group } = item;

            if (group !== currentGroupHeader) {
                currentGroupHeader = group;
                listEl.insertAdjacentHTML('beforeend', `<div class="section-divider">${groupTitles[group]}</div>`);
            }

            // カードの枠色クラス
            let cardClass = 'card-nodate';
            if (group === 1) cardClass = 'card-active';
            else if (group === 2) cardClass = 'card-sched';
            else if (group === 4) cardClass = 'card-done';

            // ステータスバッジ
            let stLabel = '見積中', stClass = 'st-estimate';
            if (site.status === 'contract' || site.status === 'active') { stLabel = '契約済・施工'; stClass = 'st-contract'; }
            if (site.status === 'billing') { stLabel = '請求'; stClass = 'st-billing'; }
            if (site.status === 'complete' || site.status === 'done') { stLabel = '完了'; stClass = 'st-complete'; }

            // 日報の【予定】タグHTML
            let schedHtml = '';
            if (siteScheds.length > 0) {
                const rows = siteScheds.map(sc => {
                    const diffD = getDiffDays(todayZero, new Date(sc.targetTime));
                    const dBadge = diffD === 0 ? '【今日】' : (diffD > 0 ? `【あと${diffD}日】` : '【経過】');
                    return `<div class="sched-tag-item">
                        <span>🔔 ${sc.dateStr} ${sc.detail}</span>
                        <span style="font-size:0.78rem;">${dBadge}</span>
                    </div>`;
                }).join('');
                schedHtml = `<div class="sched-tag-box">${rows}</div>`;
            } else if (site.workDays) {
                schedHtml = `<div class="sched-tag-box">📝 工期・現調メモ: ${site.workDays}</div>`;
            }

            // 工期＆進捗バー＆重複チェック
            let periodHtml = '';
            if (stDate && edDate) {
                const totalDur = Math.max(1, getDiffDays(stDate, edDate) + 1);
                let badgeText = `全${totalDur}日間`;
                let badgeClass = '';
                let progressPct = 0;

                if (isCurrentlyRunning) {
                    const elapsed = getDiffDays(stDate, todayZero) + 1;
                    const remain = getDiffDays(todayZero, edDate);
                    progressPct = Math.min(100, Math.max(10, Math.round((elapsed / totalDur) * 100)));
                    badgeText = `稼働中（残り${remain}日 / 全${totalDur}日）`;
                    badgeClass = 'urgent';
                } else if (stDate > todayZero) {
                    const untilStart = getDiffDays(todayZero, stDate);
                    badgeText = `着工まであと${untilStart}日（${totalDur}日間）`;
                } else {
                    progressPct = 100;
                    badgeText = `工期終了（${totalDur}日間）`;
                }

                // 重なり（他現場との重複）検出
                const overlaps = findOverlappingSites(site, activePool);
                let overlapHtml = '';
                if (overlaps.length > 0) {
                    const names = overlaps.slice(0, 2).map(o => o.name).join('・');
                    const extra = overlaps.length > 2 ? ` 他${overlaps.length - 2}件` : '';
                    overlapHtml = `<div class="overlap-alert">⚠️ 工期重複(${overlaps.length}件): ${names}${extra}</div>`;
                }

                periodHtml = `
                    <div class="period-box">
                        <div class="period-row">
                            <span>📅 ${formatShortDate(site.start)} 〜 ${formatShortDate(site.end)}</span>
                            <span class="days-badge ${badgeClass}">${badgeText}</span>
                        </div>
                        <div class="progress-track">
                            <div class="progress-fill" style="width:${progressPct}%;"></div>
                        </div>
                        ${overlapHtml}
                    </div>
                `;
            } else {
                periodHtml = `
                    <div class="period-box" style="background:#fff5f5; border-color:#ffcdd2; color:#c62828; font-size:0.85rem; font-weight:bold;">
                        ⚠️ 着工日・完工日が未設定です
                    </div>
                `;
            }

            const quickShiftBtns = (stDate && edDate)
                ? `<button class="btn-card btn-quick-shift" onclick="quickShiftSite('${site.id}', 1)">☔ +1日順延</button>`
                : '';

            const cardHtml = `
                <div class="site-card ${cardClass}">
                    <div class="card-header">
                        <span class="case-no">${site.id}</span>
                        <span class="status-badge ${stClass}">${stLabel}</span>
                    </div>
                    <div class="site-name">
                        <span>${site.name}</span>
                    </div>
                    ${schedHtml}
                    ${periodHtml}
                    <div class="card-actions">
                        <button class="btn-card btn-edit-date" onclick="openEditModal('${site.id}')">📅 日程・Gカレンダー</button>
                        ${quickShiftBtns}
                        <a href="tools.html?id=${site.id}" class="btn-card btn-open-tool">🧰 日報・黒板</a>
                    </div>
                </div>
            `;
            listEl.insertAdjacentHTML('beforeend', cardHtml);
        });
    }

    // タイル上の「☔ +1日順延」ワンタップ処理
    function quickShiftSite(siteId, days) {
        const idx = sites.findIndex(s => s.id === siteId);
        if (idx === -1) return;
        const s = sites[idx];
        const st = parseYMD(s.start);
        const ed = parseYMD(s.end);
        if (!st || !ed) return;

        st.setDate(st.getDate() + days);
        ed.setDate(ed.getDate() + days);
        s.start = formatYMD(st);
        s.end = formatYMD(ed);
        s.updatedAt = Date.now();

        localStorage.setItem('dx_sites', JSON.stringify(sites));
        renderTiles();
        showNotification(`☔ ${s.name} の工期を+${days}日順延しました`);
    }

    // モーダル操作
    function openEditModal(id) {
        const s = sites.find(x => x.id === id);
        if (!s) return;
        editingId = id;
        document.getElementById('editSiteName').textContent = s.name;
        document.getElementById('editStart').value = s.start || '';
        document.getElementById('editEnd').value = s.end || '';
        document.getElementById('editStatus').value = s.status || 'estimate';
        document.getElementById('pinDate').value = s.start || formatYMD(new Date());
        document.getElementById('overlay').classList.add('show');
        document.getElementById('dateModal').classList.add('show');
    }

    function closeModal() {
        document.getElementById('overlay').classList.remove('show');
        document.getElementById('dateModal').classList.remove('show');
        editingId = null;
    }

    // モーダル内のクイック順延ボタン
    function shiftModalDates(startDelta, endDelta) {
        const sInput = document.getElementById('editStart');
        const eInput = document.getElementById('editEnd');
        const todayStr = formatYMD(new Date());
        const st = parseYMD(sInput.value || todayStr);
        const ed = parseYMD(eInput.value || sInput.value || todayStr);

        st.setDate(st.getDate() + startDelta);
        ed.setDate(ed.getDate() + endDelta);
        sInput.value = formatYMD(st);
        eInput.value = formatYMD(ed);
    }

    // モーダルからピンポイント予定（dx_schedules）を追加
    function addPinScheduleFromManager() {
        if (!editingId) return;
        const site = sites.find(x => x.id === editingId);
        if (!site) return;

        const dVal = document.getElementById('pinDate').value;
        const tVal = document.getElementById('pinTime').value || '09:00';
        const detail = document.getElementById('pinDetail').value.trim();
        if (!dVal || !detail) {
            alert('予定の日付と内容を入力してください。');
            return;
        }

        const formattedDate = dVal.replace(/-/g, '/');
        const targetTimeMs = new Date(`${dVal}T${tVal}:00`).getTime();

        schedules.push({
            id: 'sch_' + Date.now(),
            siteId: site.id,
            siteName: site.name,
            dateStr: `${formattedDate} ${tVal}`,
            targetTime: targetTimeMs,
            detail: detail,
            notified1d: false,
            notified1h: false
        });
        localStorage.setItem('dx_schedules', JSON.stringify(schedules));
        document.getElementById('pinDetail').value = '';
        renderTiles();
        showNotification(`🔔 ${site.name} に予定タグを追加しました`);
    }

    function saveSchedule() {
        if (!editingId) return;
        const idx = sites.findIndex(s => s.id === editingId);
        if (idx !== -1) {
            const s = document.getElementById('editStart').value;
            const e = document.getElementById('editEnd').value;
            const st = document.getElementById('editStatus').value;
            if (s && e && s > e) { alert('開始日が終了日より後になっています'); return; }
            sites[idx].start = s;
            sites[idx].end = e;
            sites[idx].status = st;
            sites[idx].updatedAt = Date.now();
            localStorage.setItem('dx_sites', JSON.stringify(sites));
            renderTiles();
            closeModal();
            showNotification('💾 工期・ステータスを保存しました');
        }
    }

    // 既存のGoogleカレンダー連携（名刺QR連動）
    function sendCalendarFromManager(ev) {
        if (!editingId) return;
        const idx = sites.findIndex(s => s.id === editingId);
        if (idx === -1) return;
        const site = sites[idx];

        const inputStart = document.getElementById('editStart').value;
        const inputEnd = document.getElementById('editEnd').value;
        const inputStatus = document.getElementById('editStatus').value;

        if (inputStart && inputEnd && inputStart > inputEnd) {
            alert('開始日が終了日より後です');
            return;
        }

        const targetStart = inputStart || site.start || formatYMD(new Date());
        const targetEnd = inputEnd || site.end || targetStart;

        if (!confirm(`この工期でGoogleカレンダー（名刺QR連動）に登録・更新しますか？\n\n期間: ${targetStart} 〜 ${targetEnd}\n現場: ${site.name}`)) return;

        // ローカル保存も同時実行
        site.start = targetStart;
        site.end = targetEnd;
        site.status = inputStatus;
        site.updatedAt = Date.now();
        localStorage.setItem('dx_sites', JSON.stringify(sites));
        renderTiles();

        const gasUrl = localStorage.getItem('dx_gas_url');
        const calId = localStorage.getItem('dx_calendar_id');

        if (!gasUrl) { alert('設定エラー: 現場ナビの設定画面でGAS URLを設定してください'); return; }
        if (!calId) { alert('設定エラー: 現場ナビの設定画面でカレンダーIDを設定してください'); return; }

        const data = {
            type: 'calendar',
            calendarId: calId,
            title: `【${getStatusText(site.status)}】${site.name}`,
            description: `案件No: ${site.id}\n住所: ${site.address || ''}`,
            address: site.address || '',
            start: targetStart,
            end: targetEnd,
            authKey: localStorage.getItem('dx_auth_key') || ''
        };

        const btn = ev.currentTarget;
        const orgText = btn.innerText;
        btn.innerText = '⏳ カレンダーへ送信中...';
        btn.disabled = true;

        fetch(gasUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(data)
        })
        .then(res => res.json())
        .then(json => {
            if (json.result === 'success') {
                showNotification('✅ Gカレンダー反映＆保存完了！');
                closeModal();
            } else {
                alert('カレンダー登録エラー: ' + json.error);
            }
        })
        .catch(e => alert('通信エラー: ' + e))
        .finally(() => {
            btn.innerText = orgText;
            btn.disabled = false;
        });
    }

    function getStatusText(st) {
        const map = { 'estimate':'見積', 'contract':'施工', 'billing':'請求', 'complete':'完了', 'lost':'失注' };
        return map[st] || '予定';
    }

    function showNotification(msg) {
        const el = document.getElementById('notification');
        el.textContent = msg;
        el.classList.add('show');
        setTimeout(() => el.classList.remove('show'), 2200);
    }

    document.addEventListener('DOMContentLoaded', renderTiles);
</script>

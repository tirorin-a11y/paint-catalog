<!DOCTYPE html>
<html lang="ja">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EPKTC39SQG"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-EPKTC39SQG');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>勤怠・マイページ - 職人ギア</title>

    <link rel="icon" href="icon-192x192.png">
    <link rel="apple-touch-icon" href="icon-192x192.png">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2c3e50">

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Yu Gothic", sans-serif; background-color: #f0f2f5; margin: 0; padding: 0; color: #333; -webkit-font-smoothing: antialiased; }

        .fixed-header-group {
            position: sticky;
            top: 0;
            z-index: 100;
            background-color: #34495e;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-title-area { display: flex; align-items: baseline; gap: 8px; }
        h1 { margin: 0; font-size: 1.15rem; font-weight: bold; }
        .link-control { font-size: 0.75rem; color: white; text-decoration: none; border: 1px solid white; padding: 3px 8px; border-radius: 4px; }

        .container { max-width: 600px; margin: 0 auto; padding: 15px; padding-bottom: 80px; }

        .card {
            background: white;
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
        }
        .card h2 {
            margin-top: 0;
            font-size: 1.1rem;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
            padding-bottom: 8px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label { display: block; font-size: 0.82rem; font-weight: bold; color: #555; margin-bottom: 4px; }
        select, input[type="text"], input[type="password"], input[type="number"] {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            background: #fff;
        }

        .grid-2 { display: grid; grid-template-columns: 2fr 1fr; gap: 10px; margin-bottom: 12px; }

        .punch-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 14px;
        }
        .punch-col {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .btn-punch {
            width: 100%;
            padding: 16px 10px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.12);
            margin-top: 10px;
        }
        .btn-punch:active { transform: translateY(2px); box-shadow: none; }
        .btn-in { background-color: #0056b3; }
        .btn-out { background-color: #e67e22; }
        .btn-punch:disabled { background-color: #ccc; }

        .status-msg {
            display: none;
            margin-top: 14px;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            font-size: 0.95rem;
        }

        /* コンシェルジュBotエリア */
        .bot-btn-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn-bot {
            width: 100%;
            padding: 12px 14px;
            background: #f0f7ff;
            color: #0056b3;
            border: 1px solid #b3d7ff;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.92rem;
            text-align: left;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-bot:active { background: #e0eeff; }
        .bot-reply-box {
            display: none;
            margin-top: 12px;
            background: #2c3e50;
            color: #fff;
            padding: 14px;
            border-radius: 10px;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            position: relative;
        }
        .btn-hide-reply {
            margin-top: 10px;
            width: 100%;
            padding: 8px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 6px;
            font-size: 0.8rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="fixed-header-group">
    <header>
        <div class="header-title-area">
            <h1>⏱️ 出退勤・マイページ</h1>
        </div>
        <div style="display:flex; gap:6px;">
            <a href="navi.html" class="link-control">🚗 現場ナビ</a>
            <a href="index.html" class="link-control">🏠 ホーム</a>
        </div>
    </header>
</div>

<div class="container">

    <!-- ① 本人確認＆出退勤打刻カード -->
    <div class="card">
        <h2>
            <span>⏱️ 出退勤打刻</span>
            <span id="clockDisplay" style="font-size:0.9rem; color:#0056b3; font-family:monospace;">--:--</span>
        </h2>

        <div class="grid-2">
            <div>
                <label>👤 スタッフ名</label>
                <select id="attStaffSelect">
                    <option value="">読込中...</option>
                </select>
            </div>
            <div>
                <label>🔑 PIN(4桁)</label>
                <input type="password" id="attPinInput" inputmode="numeric" maxlength="4" placeholder="1234">
            </div>
        </div>

        <!-- 出勤エリアと退勤エリアを左右に分離（出勤時は休憩を送らない） -->
        <div class="punch-box">
            <!-- 左：出勤用 -->
            <div class="punch-col">
                <div>
                    <label>🏠 本日の現場（出勤時）</label>
                    <select id="attSiteSelect" onchange="toggleCustomSiteInput()" style="padding:10px; font-size:0.9rem;">
                        <option value="">-- 現場を選択 --</option>
                    </select>
                    <input type="text" id="attSiteInput" placeholder="現場名を手入力" style="padding:10px; font-size:0.9rem; margin-top:6px; display:none;">
                </div>
                <button id="attBtnIn" class="btn-punch btn-in" onclick="sendTimecard('in')">🌅 出 勤</button>
            </div>

            <!-- 右：退勤用 -->
            <div class="punch-col">
                <div>
                    <label>☕ 休憩時間（退勤時・記憶）</label>
                    <select id="attBreakSelect" onchange="saveBreakPreference()" style="padding:10px; font-size:0.9rem;">
                        <option value="60">60分</option>
                        <option value="90">90分</option>
                        <option value="120">120分</option>
                        <option value="45">45分</option>
                        <option value="30">30分</option>
                        <option value="0">0分（なし）</option>
                    </select>
                    <div style="font-size:0.72rem; color:#777; margin-top:4px;">※選んだ時間は次回も記憶されます</div>
                </div>
                <button id="attBtnOut" class="btn-punch btn-out" onclick="sendTimecard('out')">🌇 退 勤</button>
            </div>
        </div>

        <div id="attStatusMsg" class="status-msg"></div>
    </div>

    <!-- ② 出勤中限定：給与・手当コンシェルジュBot -->
    <div class="card">
        <h2>
            <span>🤖 給与・手当コンシェルジュ</span>
            <span style="font-size:0.72rem; background:#e8f5e9; color:#2e7d32; padding:2px 8px; border-radius:10px;">出勤中のみ有効</span>
        </h2>
        <p style="font-size:0.8rem; color:#666; margin-top:0; margin-bottom:10px;">
            ※明細のプライバシー保護のため、あなたが<strong>「出勤中」</strong>の間だけPINコード認証で自分の単価や今月の概算給料をこっそり確認できます。
        </p>

        <div class="bot-btn-grid">
            <button class="btn-bot" onclick="askBot('rate')">
                <span>💡 自分の基本日給・手当の設定を見る</span>
                <span>▶</span>
            </button>
            <button class="btn-bot" onclick="askBot('estimate')">
                <span>📊 今月のここまでの概算給料を計算</span>
                <span>▶</span>
            </button>
            <button class="btn-bot" onclick="askBot('savings')">
                <span>🏦 現在の社内貯金・積立残高を見る</span>
                <span>▶</span>
            </button>
        </div>

        <div id="botReplyBox" class="bot-reply-box">
            <div id="botReplyText"></div>
            <button class="btn-hide-reply" onclick="document.getElementById('botReplyBox').style.display='none'">🙈 画面を隠す（閉じる）</button>
        </div>
    </div>

    <!-- ③ 前払い・社内貯金の申請カード -->
    <div class="card">
        <h2>💰 前払い・社内貯金の申請</h2>
        <div style="display:flex; flex-direction:column; gap:10px;">
            <div>
                <label>申請の種類</label>
                <select id="attAdjType">
                    <option value="前払い（仮払い）">前払い（給料日前の仮払い）</option>
                    <option value="貯金引き出し">社内貯金の引き出し</option>
                    <option value="任意積立（追加）">社内貯金の追加積立</option>
                </select>
            </div>
            <div>
                <label>希望金額（円）</label>
                <input type="number" id="attAdjAmount" step="1000" placeholder="例: 10000">
            </div>
            <div>
                <label>理由・メモ</label>
                <input type="text" id="attAdjMemo" placeholder="例: 車の修理代">
            </div>
            <button id="attBtnAdj" onclick="sendAdjustment()" style="padding:14px; background:#00C853; color:white; border:none; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; margin-top:4px;">
                📩 申請を送信する
            </button>
        </div>
    </div>

</div>

<script>
    const GAS_WEBAPP_URL = localStorage.getItem("expenseGasUrl") || "";
    let attStaffList = [];

    window.addEventListener('DOMContentLoaded', () => {
        updateClock();
        setInterval(updateClock, 1000);
        restoreBreakPreference();
        loadSitesFromLocalStorage();
        loadStaffListFromGAS();
    });

    function updateClock() {
        const now = new Date();
        const hh = ('0' + now.getHours()).slice(-2);
        const mm = ('0' + now.getMinutes()).slice(-2);
        document.getElementById('clockDisplay').textContent = `${now.getMonth()+1}/${now.getDate()} ${hh}:${mm}`;
    }

    // ★休憩時間の記憶と復元
    function saveBreakPreference() {
        const val = document.getElementById('attBreakSelect').value;
        localStorage.setItem('dx_my_break_min', val);
    }

    function restoreBreakPreference() {
        const saved = localStorage.getItem('dx_my_break_min');
        if (saved !== null) {
            document.getElementById('attBreakSelect').value = saved;
        }
    }

    // 現場ナビ(dx_sites)から稼働中の現場をプルダウンにセット
    function loadSitesFromLocalStorage() {
        const select = document.getElementById('attSiteSelect');
        if (!select) return;

        const sites = JSON.parse(localStorage.getItem('dx_sites') || '[]');
        const activeSites = sites.filter(s => s.status !== 'complete' && s.status !== 'done' && s.status !== 'lost');
        activeSites.sort((a, b) => {
            const isAContract = (a.status === 'contract' || a.status === 'active') ? 0 : 1;
            const isBContract = (b.status === 'contract' || b.status === 'active') ? 0 : 1;
            if (isAContract !== isBContract) return isAContract - isBContract;
            return (b.updatedAt || 0) - (a.updatedAt || 0);
        });

        const savedSite = localStorage.getItem('dx_last_att_site') || '';
        select.innerHTML = '<option value="">-- 現場を選択 --</option>';

        activeSites.forEach(s => {
            const opt = document.createElement('option');
            opt.value = s.name;
            const badge = (s.status === 'contract' || s.status === 'active') ? '🤝' : (s.status === 'billing' ? '💰' : '📄');
            opt.textContent = `${badge} ${s.name}`;
            if (s.name === savedSite) opt.selected = true;
            select.appendChild(opt);
        });

        const customOpt = document.createElement('option');
        customOpt.value = '__custom__';
        customOpt.textContent = '✏️ その他（手入力する）';
        select.appendChild(customOpt);
    }

    function toggleCustomSiteInput() {
        const select = document.getElementById('attSiteSelect');
        const input = document.getElementById('attSiteInput');
        if (select.value === '__custom__') {
            input.style.display = 'block';
            input.focus();
        } else {
            input.style.display = 'none';
            input.value = '';
        }
    }

    async function loadStaffListFromGAS() {
        const select = document.getElementById('attStaffSelect');
        if (!GAS_WEBAPP_URL) {
            select.innerHTML = '<option value="">GAS URL未設定(現場ナビ設定へ)</option>';
            return;
        }
        try {
            const res = await fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'getStaffList',
                    authKey: localStorage.getItem('dx_auth_key') || ""
                })
            });
            const data = await res.json();
            if (data.list) {
                attStaffList = data.list;
                const savedStaffId = localStorage.getItem('dx_my_staff_id') || "";
                select.innerHTML = '<option value="">-- 名前を選択 --</option>';
                data.list.forEach(s => {
                    const opt = document.createElement('option');
                    opt.value = s.id;
                    opt.textContent = `${s.name} (${s.role})`;
                    if (s.id === savedStaffId) opt.selected = true;
                    select.appendChild(opt);
                });
            }
        } catch (e) {
            select.innerHTML = '<option value="">通信エラー</option>';
        }
    }

    function showAttMsg(msg, isOk) {
        const box = document.getElementById('attStatusMsg');
        box.style.display = 'block';
        box.style.background = isOk ? '#e6f4ea' : '#fce8e6';
        box.style.color = isOk ? '#137333' : '#c5221f';
        box.textContent = msg;
    }

    async function sendTimecard(type) {
        if (!GAS_WEBAPP_URL) return alert('現場ナビの設定画面で経費・勤怠用GAS URLを登録してください。');
        const staffId = document.getElementById('attStaffSelect').value;
        const pin = document.getElementById('attPinInput').value;
        const siteSelectVal = document.getElementById('attSiteSelect').value;
        const siteName = (siteSelectVal === '__custom__')
            ? document.getElementById('attSiteInput').value.trim()
            : siteSelectVal;
        const breakMinutes = document.getElementById('attBreakSelect').value;

        if (!staffId || !pin) {
            return showAttMsg('⚠️ スタッフ名とPINコードを入力してください', false);
        }

        localStorage.setItem('dx_my_staff_id', staffId);
        if (siteName) localStorage.setItem('dx_last_att_site', siteName);
        saveBreakPreference();

        const staff = attStaffList.find(s => s.id === staffId);
        const btnIn = document.getElementById('attBtnIn');
        const btnOut = document.getElementById('attBtnOut');
        btnIn.disabled = true;
        btnOut.disabled = true;
        showAttMsg('⏳ 打刻データを送信中...', true);

        try {
            const payload = {
                action: 'punchTimecard',
                authKey: localStorage.getItem('dx_auth_key') || "",
                staffId: staffId,
                staffName: staff ? staff.name : '',
                pin: pin,
                type: type,
                siteName: siteName
            };
            // ★退勤の時だけ休憩時間を送る（出勤時は一切送らない）
            if (type === 'out') {
                payload.breakMinutes = breakMinutes;
            }

            const res = await fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            showAttMsg(result.message, result.success);
        } catch (err) {
            showAttMsg('通信エラー: ' + err.message, false);
        } finally {
            btnIn.disabled = false;
            btnOut.disabled = false;
        }
    }

    // ★出勤中限定コンシェルジュBotへの質問送信
    async function askBot(queryType) {
        if (!GAS_WEBAPP_URL) return alert('GAS URLが未設定です。');
        const staffId = document.getElementById('attStaffSelect').value;
        const pin = document.getElementById('attPinInput').value;

        if (!staffId || !pin) {
            alert('上部の「👤 スタッフ名」と「🔑 PINコード」を入力してからボタンを押してください。');
            return;
        }

        const replyBox = document.getElementById('botReplyBox');
        const replyText = document.getElementById('botReplyText');
        replyBox.style.display = 'block';
        replyText.textContent = '🤖 照会中...（出勤ステータスを確認しています）';

        try {
            const res = await fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'askSalaryBot',
                    authKey: localStorage.getItem('dx_auth_key') || "",
                    staffId: staffId,
                    pin: pin,
                    queryType: queryType
                })
            });
            const data = await res.json();
            replyText.textContent = data.reply || 'エラーが発生しました。';
        } catch (err) {
            replyText.textContent = '通信エラー: ' + err.message;
        }
    }

    async function sendAdjustment() {
        if (!GAS_WEBAPP_URL) return alert('GAS URLが未設定です。');
        const staffId = document.getElementById('attStaffSelect').value;
        const adjType = document.getElementById('attAdjType').value;
        const amount = document.getElementById('attAdjAmount').value;
        const memo = document.getElementById('attAdjMemo').value.trim();

        if (!staffId || !amount) {
            return alert('スタッフ名を選択し、希望金額を入力してください。');
        }

        const staff = attStaffList.find(s => s.id === staffId);
        const btn = document.getElementById('attBtnAdj');
        btn.disabled = true;

        try {
            const res = await fetch(GAS_WEBAPP_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({
                    action: 'submitAdjustment',
                    authKey: localStorage.getItem('dx_auth_key') || "",
                    staffId: staffId,
                    staffName: staff ? staff.name : '',
                    adjType: adjType,
                    amount: amount,
                    memo: memo
                })
            });
            const result = await res.json();
            alert(result.message);
            document.getElementById('attAdjAmount').value = '';
            document.getElementById('attAdjMemo').value = '';
        } catch (err) {
            alert('送信エラー: ' + err.message);
        } finally {
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
